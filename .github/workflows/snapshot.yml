name: Actualizar snapshot de datos

on:
  schedule:
    # Lunes a viernes, cada 2 h entre 7:00 y 19:00 (hora de Colombia = UTC-5)
    - cron: '0 12-23/2 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar datos del OData
        working-directory: sofia
        env:
          SOFIA_ODATA_URL: ${{ secrets.SOFIA_ODATA_URL }}
          SOFIA_ODATA_USER: ${{ secrets.SOFIA_ODATA_USER }}
          SOFIA_ODATA_PASS: ${{ secrets.SOFIA_ODATA_PASS }}
          SOFIA_ODATA_TEMPLATE: ${{ secrets.SOFIA_ODATA_TEMPLATE }}
        run: node scripts/fetch-snapshot.js
      - name: Guardar si cambió
        if: always()
        run: |
          git config user.name "sofia-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sofia/data/snapshot
          git diff --cached --quiet || (git commit -m "chore(data): actualizar snapshot OData" && git pull --rebase -q && git push -q)
