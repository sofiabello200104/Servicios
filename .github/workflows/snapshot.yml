name: Copia automática de datos (OData)

# Descarga los datos del OData y los publica en la rama `datos`
# (un solo commit que se reemplaza cada vez). SOFIA los lee al abrir, así que
# no depende de esperar al servidor OData. No toca `main` ni genera despliegues.
on:
  schedule:
    # Lunes a viernes, cada 2 horas de 7:15 a 17:15 (hora Colombia = UTC-5)
    - cron: '15 12-22/2 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: copia-datos
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recuperar la última copia buena
        run: |
          mkdir -p snapshot-out
          if git fetch -q origin datos 2>/dev/null; then
            git --work-tree=snapshot-out checkout origin/datos -- . 2>/dev/null || true
            git reset -q
          fi
          ls -la snapshot-out || true
      - name: Descargar datos del OData
        env:
          SOFIA_ODATA_URL: ${{ secrets.SOFIA_ODATA_URL }}
          SOFIA_ODATA_USER: ${{ secrets.SOFIA_ODATA_USER }}
          SOFIA_ODATA_PASS: ${{ secrets.SOFIA_ODATA_PASS }}
          SOFIA_ODATA_TEMPLATE: ${{ secrets.SOFIA_ODATA_TEMPLATE }}
          SNAPSHOT_DIR: ${{ github.workspace }}/snapshot-out
        run: node sofia/scripts/fetch-snapshot.js
      - name: Publicar en la rama datos
        if: always()
        run: |
          cd snapshot-out
          [ -f meta.json ] || { echo "Aún no hay copia que publicar"; exit 0; }
          # Evita que Vercel intente desplegar esta rama.
          mkdir -p sofia && echo '{"git":{"deploymentEnabled":false}}' > sofia/vercel.json
          git init -q -b datos
          git config user.name "sofia-copia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Copia automática de datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
